<div class="container vh-100 d-flex justify-content-center align-items-center">

  <div class="card p-4 shadow" style="width: 700px;">

    <div class="row g-3">

      <div class="col-3">
        <div>Số nhà</div>
        <input class="form-control"
        [ngModel]="house()"
       (ngModelChange)="house.set($event)">
      </div>

      <div class="col-3">
        <div>Đường</div>
        <input class="form-control"
        [ngModel]="street()"
       (ngModelChange)="street.set($event)">
      </div>

      <div class="col-3">
        <div>Xã / Quận</div>
        <input class="form-control"
        [ngModel]="ward()"
       (ngModelChange)="ward.set($event)">
      </div>

      <div class="col-3">
        <div>Thành phố</div>
        <input class="form-control"
        [ngModel]="city()"
       (ngModelChange)="city.set($event)">
      </div>

      <div class="col-6">
        <div>Tên người nhận</div>
        <input class="form-control"
        [ngModel]="receiver_name()"
       (ngModelChange)="receiver_name.set($event)">
      </div>

      <div class="col-6">
        <div>Số điện thoại</div>
        <input class="form-control"
        [ngModel]="phone_number()"
       (ngModelChange)="phone_number.set($event)">
      </div>

      <div class="col-12">
        <div>Địa chỉ cụ thể</div>
        <input class="form-control">
      </div>

      <div class="col-12">
        <button class="btn btn-primary w-100" (click)="saveAddress()">
          Lưu thay đổi
        </button>
      </div>

    </div>

  </div>

</div>
