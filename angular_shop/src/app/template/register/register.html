<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-4">Đăng ký</h3>

    <form>
      <p>username</p>
      <input class="form-control mb-3" [(ngModel)]="username" name="username">
      <p>email</p>
      <input class="form-control mb-3" [(ngModel)]="email" name="email">
      <p>password</p>
      <input class="form-control mb-3" [(ngModel)]="password" name="password">
      <p>password again</p>
      <input class="form-control mb-3" [(ngModel)]="repassword" name="repassword">
      <button class="btn btn-link d-block mx-auto" (click)="gotologin()">đăng nhập</button>

      <button (click)="register()" class="btn btn-primary w-100">Đăng ký</button>
    </form>
  </div>
</div>
