<div class="container py-5">

  <div class="row justify-content-center  align-items-start">
    <div class="col-md-6">

      <div class="card shadow">

        <div class="card-body">

          <h3 class="text-center mb-4">Giỏ hàng</h3>

          @for (item of cartService.cart(); track item.product_id) {
            <div class="d-flex justify-content-between align-items-center border-bottom py-2">

              <div>
                <div class="fw-bold">{{ item.name }}</div>
                <small class="text-muted">
                  Giá: {{ item.discount_price }}
                </small>
              </div>

              <div class="d-flex align-items-center gap-2">

                <button class="btn btn-sm btn-primary"
                        (click)="cartService.decrease(item)">-</button>

                <span class="px-2">{{ item.qty }}</span>

                <button class="btn btn-sm btn-primary"
                        (click)="cartService.increase(item)">+</button>

              </div>

              <button class="btn btn-sm btn-outline-danger"
                      (click)="cartService.remove(item.product_id)">
                Xóa
              </button>

            </div>
          }

          <div class="mt-3 text-end">
            <h5>
              Tổng: 
              <span class="text-success">
                {{ cartService.getTotal() }}
              </span>
            </h5>
          </div>

          <button class="btn btn-success w-100 mt-3"
                  (click)="gotocheckout()">
            đặt hàng
          </button>

          <button class="btn btn-success w-100 mt-3"
                  (click)="checkout()">
            Thanh toán
          </button>

        </div>

      </div>
      

    </div>
    <div class="col-md-3">

  <div class="border rounded p-3 shadow-sm"
       style="max-height:250px; overflow-y:auto;">

    <h5 class="mb-3">Địa chỉ</h5>

    @for (address of addresses(); track address.address_id) {

      <div class="form-check border-bottom py-2">

        <input
          class="form-check-input"
          type="radio"
          name="address"
          [value]="address.address_id">

        <label class="form-check-label w-100">

          <div class="fw-bold">
            {{ address.receiver_name }}
          </div>

          <div>
            {{ address.phone_number }}
          </div>

          <small class="text-muted">
            {{ address.address }}
          </small>

        </label>

      </div>
    }

    <button class="btn btn-outline-primary w-100 mt-3" (click)="gotoaddress()">
      + Thêm địa chỉ
    </button>

  </div>

</div>
  </div>

</div>
