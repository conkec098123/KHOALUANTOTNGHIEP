<div class="container py-5">

  <div class="row justify-content-center  align-items-start">
    <div class="col-md-6">

      <div class="card shadow">

        <div class="card-body">

          <h3 class="text-center mb-4">Giỏ hàng</h3>

          @for (item of cartService.cart(); track item.product_id) {
            <div class="d-flex justify-content-between align-items-center border-bottom py-2">

              <div class="d-flex align-items-center">

  <img
    [src]="item.image"
    class="rounded border me-3"
    width="90"
    height="90"
    style="object-fit: cover;">

  <div>

    <div class="fw-bold">
      {{ item.name }}
    </div>

    <small class="text-muted d-block">
      Giá:
      <span class="text-danger fw-bold">
        {{ item.discount_price }}
      </span>
    </small>

  </div>

</div>

              <div class="d-flex align-items-center gap-2">

                <button class="btn btn-sm btn-primary"
                        (click)="cartService.decrease(item)">-</button>

                <span class="px-2">{{ item.qty }}</span>

                <button class="btn btn-sm btn-primary me-3"
                        (click)="cartService.increase(item)">+</button>

              </div>

              <button class="btn btn-sm btn-outline-danger"
                      (click)="cartService.remove(item.product_id)">
                Xóa
              </button>

            </div>
          }

          <div class="mt-3 text-end">
            <h5>
              Tổng: 
              <span class="text-success">
                {{ cartService.getTotal() }}
              </span>
            </h5>
          </div>

          <button class="btn btn-success w-100 mt-3"
                  (click)="gotocheckout()">
            Thanh toán
          </button>

        </div>

      </div>
      

    </div>

  </div>

</div>
