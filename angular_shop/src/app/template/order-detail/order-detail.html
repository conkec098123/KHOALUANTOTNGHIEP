@for (item of details(); track item.order_detail_id) {

<div class="card mb-3">

  <div class="card-body d-flex justify-content-between">

    <div>
      <div class="fw-bold">
        {{ item.product_name }}
      </div>

      <div>
        SL: {{ item.qty }}
      </div>
      <button class="btn btn-primary mt-2"
          (click)="goToReview(item.order_detail_id)">
    Đánh giá
  </button>
    </div>

    <div class="text-end">

      <div class="text-success">
        {{ item.subtotal }}
      </div>

    </div>

  </div>

</div>

}
