<form (ngSubmit)="resetPassword()">
            <p>Nhập mật khẩu mới</p>
            <input [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" name="password">
            <div>
                <button type="submit" class="btn btn-primary w-100">Đổi mật khẩu</button>
            </div>
        </form>
