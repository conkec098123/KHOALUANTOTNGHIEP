<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-4">Đổi mật khẩu</h3>

    <form>
        <p>nhập lại mật khẩu cũ</p>
      <input class="form-control mb-3" [(ngModel)]="password" name="password">
      <p>nhập mật khẩu mới</p>
      <input class="form-control mb-3" [(ngModel)]="newpassword" name="newpassword">
      <button (click)="changepassword()" class="btn btn-primary w-100">Đổi mật khẩu</button>
    </form>
  </div>
</div>
