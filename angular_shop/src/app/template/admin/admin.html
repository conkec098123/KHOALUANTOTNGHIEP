<a class="nav-link" [routerLink]="['/add-product']">add-product</a>
@for (product of products(); track product.id) {
  <div>
    <p>ID: {{ product.id }}</p>
    <p>{{ product.name }}</p>
    <p>Giá: {{ product.price }}</p>
    <p>Sau giảm: {{ product.discount_price }}</p>
    <p>Tồn kho: {{ product.qty }}</p>

    
    <button (click)="goToEdit(product.id)">edit-product</button>
    <button (click)="deleteProduct(product.id)">
  Xóa
</button>
  </div>
}
