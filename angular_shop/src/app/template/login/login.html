<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center mb-4">Đăng nhập</h3>

    <form>
      <p>email</p>
      <input class="form-control mb-3" [(ngModel)]="email" name="email">
      <p>password</p>
      <input class="form-control mb-3" [(ngModel)]="password" name="password">
      <div class="mb-3">
        <button class="btn btn-link" (click)="gotoforgetpassword()">quên mật khẩu</button>
        <button class="btn btn-link" (click)="gotoregister()">đăng ký</button>
      </div>


      
      <button (click)="login()" class="btn btn-primary w-100">Đăng nhập</button>

      <div id="googleBtn"></div> 
      
    </form>
  </div>
</div>
